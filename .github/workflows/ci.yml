name: Checks
on: [push, pull_request]
jobs:
 test:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v7
   - uses: ruby/setup-ruby@v1
     with:
      bundler-cache: true
   - run: bin/test
 lint:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v7
   - uses: ruby/setup-ruby@v1
     with:
      bundler-cache: true
   - run: bundle exec rubocop -f github
